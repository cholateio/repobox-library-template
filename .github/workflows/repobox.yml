name: repobox

on:
  push:
    branches: [main]
    paths: ['inbox/*.json']
  workflow_dispatch:
    inputs:
      url:
        description: GitHub repo URL to (re)analyze; empty = process inbox
        required: false
        default: ''

concurrency:
  group: repobox
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  repobox:
    uses: cholateio/repobox/.github/workflows/analyze.yml@60e57ed6dfa242dbf1680cbdfdec0b3ed851944a
    with:
      url: ${{ inputs.url }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
